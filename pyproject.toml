[project]
name = "triage"
version = "0.1.0"
description = "Solar PV fault triage: flag, classify, attribute, and report"
readme = "README.md"
requires-python = ">=3.11"
# the edge plugin's footprint: everything the batch pipeline needs beyond
# this lives in the `batch` group (installed by default locally, excluded
# from the plugin image with --no-default-groups)
dependencies = [
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "pandas>=3.0.5",
    "pvlib>=0.15.2",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
plugin = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
triage = "triage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
batch = [
    "plotly>=6.9.0",     # classify/plot + report
    "pvanalytics>=0.2.2",  # ingest/quality gate
    "pyarrow>=25.0.0",   # lake adapter parquet reads
    "rdtools>=3.2.1",    # classify/trend
]

[tool.uv]
default-groups = ["dev", "batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
