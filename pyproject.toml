[project]
name = "triage"
version = "0.1.0"
description = "Solar PV fault triage: flag, classify, attribute, and report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pvanalytics>=0.2.2",
    "pvlib>=0.15.2",
    "pyarrow>=25.0.0",
    "rdtools>=3.2.1",
    "scikit-learn>=1.9.0",
]

[project.scripts]
triage = "triage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
