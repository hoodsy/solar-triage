[project]
name = "triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pvlib>=0.15.2",
    "uvicorn>=0.51.0",
]

[project.scripts]
triage = "triage.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
